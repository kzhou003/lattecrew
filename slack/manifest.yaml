display_information:
  name: KiroCrew-latte
  description: AI agent management layer with persistent memory, scheduled jobs, and multi-session orchestration
  background_color: "#1a1a2e"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: KiroCrew-latte
    always_online: true
  slash_commands:
    - command: /kirocrew-latte
      description: Dashboard access and channel tracking
      usage_hint: "dashboard [duration] | #channel"
      should_escape: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - reactions:write
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.im
      - message.channels
      - message.groups
      - app_mention
      - app_home_opened
      - file_change
      - member_joined_channel
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
